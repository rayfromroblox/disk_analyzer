[workspace]
members = [
    "crates/disk-core",
    "apps/disk-cli",
    "apps/disk-tui",
    "apps/disk-desktop/src-tauri",
]
default-members = [
    "crates/disk-core",
    "apps/disk-cli",
    "apps/disk-tui",
]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Disk Analyzer contributors"]
repository = "https://github.com/rayfromroblox/disk_analyzer"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
csv = "1.3"
ctrlc = "3.5"
jwalk = "0.8.1"
open = "5.3"
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
