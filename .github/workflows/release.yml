name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/disk-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/disk-desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ships an older strip that cannot read newer ELF RELR
          # sections. Cargo already strips our release binary.
          NO_STRIP: "true"
        with:
          projectPath: apps/disk-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Disk Analyzer ${{ github.ref_name }}"
          releaseBody: |
            Download the file for your computer, then open it:

            - **Windows:** the `-setup.exe` installer (recommended) or `.msi`
            - **macOS:** the `.dmg` that matches Apple Silicon or Intel
            - **Linux:** the `.AppImage` (works on most distributions) or `.deb` for Debian/Ubuntu

            The CLI and TUI archives are for terminal users. No Rust, Node.js, or source checkout is required for the desktop application.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  tools:
    name: CLI and TUI (${{ matrix.target }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: disk-analyzer,disk-analyzer-tui
          target: ${{ matrix.target }}
          archive: disk-analyzer-$target
          token: ${{ secrets.GITHUB_TOKEN }}
