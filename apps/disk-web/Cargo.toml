[package]
name = "disk-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local web server and browser interface for the disk analyzer"
build = "build.rs"

[[bin]]
name = "web-disk-analyzer"
path = "src/main.rs"

[lib]
name = "disk_web"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
disk-core = { path = "../../crates/disk-core" }
mime_guess = "2.0"
open.workspace = true
rust-embed = "8.7"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.47", features = [
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
